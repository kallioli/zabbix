# snmptrapd configuration for the Zabbix proxy on Windows.
#
# The Zabbix proxy does not listen for SNMP traps itself; its "SNMP trapper"
# process reads a file that a trap daemon writes. This is that daemon's
# configuration. snmptrapd (Net-SNMP) receives traps on UDP 162 and appends
# each one to the file the proxy tails, in the "ZBXTRAP <address>" layout the
# proxy expects. No Perl is involved: the layout is produced by the format1 /
# format2 directives below, so nothing extra has to be installed.
#
# The MSI registers snmptrapd as the auto-start Windows service
# "Net-SNMP Trap Handler", started with -n (numeric addresses) and pointed at
# this file, appending traps to
#     C:\ProgramData\Zabbix Proxy\zabbix_traps.tmp
# To make the proxy read them, zabbix_proxy.conf needs:
#     StartSNMPTrapper=1
#     SNMPTrapperFile=C:\ProgramData\Zabbix Proxy\zabbix_traps.tmp
# The installer sets both for you; delete them (and stop the trap service) to
# turn trap reception off.

############ ACCESS CONTROL #############

### Option: authCommunity
#	Accept SNMPv1/v2c traps carrying this community and log them (logging is
#	what writes them to the file). Change "public" to the community your
#	devices send, or add more authCommunity lines, one per community.
#	For SNMPv3, replace this with createUser + authUser; see snmptrapd.conf(5).
authCommunity	log,execute,net public

############ TRAP OUTPUT FORMAT #########

### Option: format1 / format2
#	Each trap is written as:  <local time> ZBXTRAP <sender> <varbinds>
#	The proxy takes the whitespace-delimited token right after ZBXTRAP as the
#	address to match against a host's SNMP interface, and stores the rest as
#	the item value. %B is the trap sender (numeric because the service runs
#	with -n); %v is the list of variable bindings. format1 formats SNMPv1
#	traps, format2 formats SNMPv2c and SNMPv3 notifications.
#
#	Address matching note: on a proxy %B yields the sending host's address,
#	which suits most devices. Verify it matches your equipment's SNMP interface
#	address; traps that match nothing still land on an snmptrap.fallback item if
#	you define one. For exact extraction the upstream Perl receiver remains an
#	option (see the Zabbix manual, "SNMP traps").
format1	%.4y-%.2m-%.2lT%.2h:%.2j:%.2k ZBXTRAP %B\n%v\n
format2	%.4y-%.2m-%.2lT%.2h:%.2j:%.2k ZBXTRAP %B\n%v\n
